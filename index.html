.dbx-nrow time{margin-left:auto;font-size:11.5px;color:#D1D6DB;flex-shrink:0}
.dbx-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dbx-g2a{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.dbx-g2b{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.dbx-g2c{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.dbx-qg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1279px){.dbx-g4{grid-template-columns:repeat(2,1fr)}.dbx-g2a,.dbx-g2b,.dbx-g2c{grid-template-columns:1fr}}
@media(max-width:767px){.dbx-hero{flex-direction:column;align-items:flex-start}.dbx-chips{width:100%;justify-content:space-around}.dbx-g4{grid-template-columns:1fr 1fr;gap:10px}.dbx-qg{grid-template-columns:1fr 1fr}}


.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;max-width:100%;border-top:1px solid #E5E8EB;border-left:1px solid #E5E8EB}
.cal-grid>*{min-width:0;border-right:1px solid #E5E8EB;border-bottom:1px solid #E5E8EB;box-sizing:border-box}
.cal-grid.cal-head>*{border-right:none;border-bottom:none}
.cal-grid.cal-head{border:none}
/* 가로 드래그 스크롤(카테고리·필터·테이블·스테퍼) */
.h-scroll{display:flex;flex-wrap:nowrap!important;align-items:center;gap:.375rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;max-width:100%}
.h-scroll::-webkit-scrollbar{display:none;height:0}
.h-scroll>*{flex:0 0 auto}
.overflow-x-auto{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
@media (max-width:767px){
  .cal-day-num{width:1.375rem!important;height:1.375rem!important;font-size:12px!important}
  main{max-width:100%;min-width:0}
}
.wf-stepper{max-width:100%}
.wf-stepper .break-keep{word-break:keep-all;overflow-wrap:anywhere}
#scrollTopBtn{transition:opacity .15s,transform .15s,box-shadow .15s}#scrollTopBtn:hover{box-shadow:0 10px 28px rgba(25,31,40,.22)}#scrollTopBtn:active{transform:scale(.96)}
@media(max-width:639px){#qChanList{max-height:50vh}}
aside[data-sidenav] .side-label-mini{display:none;}
@media(min-width:768px){
aside[data-sidenav]{overflow-x:hidden;width:14rem!important;transition:width .28s cubic-bezier(.2,.8,.2,1);}
aside[data-sidenav].is-folded{width:4.75rem!important;}
main[data-main]{transition:margin-left .28s cubic-bezier(.2,.8,.2,1);}
main[data-main].is-folded{margin-left:4.75rem!important;}
aside[data-sidenav] .side-label-mini{display:none;}
aside[data-sidenav].is-folded .side-nav-btn,
aside[data-sidenav].is-animating .side-nav-btn{
  flex-direction:column!important;align-items:center!important;justify-content:center!important;
  gap:.2rem!important;padding:.55rem .2rem!important;border-radius:.75rem!important;
  font-size:10px!important;font-weight:600!important;line-height:1.15!important;text-align:center!important;
}
aside[data-sidenav].is-folded .side-label-full,
aside[data-sidenav].is-animating .side-label-full,
aside[data-sidenav].is-folded .side-dot-full,
aside[data-sidenav].is-animating .side-dot-full{display:none!important;}
aside[data-sidenav].is-folded .side-label-mini,
aside[data-sidenav].is-animating .side-label-mini{
  display:block!important;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10px;font-weight:600;line-height:1.15;opacity:1;
}
aside[data-sidenav].is-folded .side-brand-btn,
aside[data-sidenav].is-animating .side-brand-btn{
  flex-direction:column!important;width:100%;height:auto!important;min-height:2.75rem;
  justify-content:center;align-items:center;gap:.15rem!important;padding:.35rem .1rem!important;
  border-radius:.75rem;background:#EAF2FF;
}
aside[data-sidenav].is-folded .side-brand-btn svg,
aside[data-sidenav].is-animating .side-brand-btn svg{width:1.35rem;height:1.35rem;}
aside[data-sidenav].is-folded .side-bell-top{
  display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
  width:100%!important;height:auto!important;min-height:2.75rem;padding:.35rem .1rem!important;
  gap:.15rem!important;border-radius:.75rem!important;margin:0!important;
}
aside[data-sidenav].is-folded .side-bell-badge{display:grid;}
aside[data-sidenav]:not(.is-folded) .side-bell-badge{display:none!important;}
aside[data-sidenav].is-folded [data-side-head]{padding:.45rem .3rem .2rem!important;}
aside[data-sidenav].is-folded [data-side-head]>div{gap:.25rem!important;width:100%;}
aside[data-sidenav].is-folded [data-side-foot]{padding:.3rem .3rem .45rem!important;}
aside[data-sidenav].is-folded nav{padding-left:.3rem!important;padding-right:.3rem!important;padding-top:.15rem!important;}
}
